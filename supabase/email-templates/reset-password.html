<!--
  Supabase → Authentication → Emails → Templates → "Reset password".
  Subject: Your Wotri password reset code
  Paste everything below this comment into the Message body (HTML).
  Email clients ignore <style> blocks and most layout CSS, so everything is
  tables and inline styles.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>Your Wotri password reset code</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f2ef;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f2ef;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px; background-color:#ffffff; border-radius:16px;">
            <tr>
              <td align="center" style="padding:40px 32px 8px;">
                <img src="https://wotri.app/icon.png" width="64" height="64" alt="Wotri" style="display:block; border:0; border-radius:14px;" />
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:16px 32px 0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:24px; line-height:32px; font-weight:700; color:#1a1a1a;">
                Reset your password
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:12px 32px 0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:16px; line-height:24px; color:#555555;">
                Enter this code in the Wotri app to choose a new password.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 32px 8px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" style="padding:16px 28px; background-color:#fff1ec; border-radius:12px; font-family:'SF Mono', Menlo, Consolas, 'Courier New', monospace; font-size:32px; line-height:40px; font-weight:700; letter-spacing:8px; color:#FF5722;">
                      {{ .Token }}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 32px 40px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:20px; color:#999999;">
                Didn't ask to reset your password? You can ignore this email. Your password won't change.
              </td>
            </tr>
          </table>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
            <tr>
              <td align="center" style="padding:20px 32px 0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:12px; line-height:18px; color:#999999;">
                Wotri · <a href="https://wotri.app" style="color:#999999; text-decoration:underline;">wotri.app</a> · <a href="mailto:support@wotri.app" style="color:#999999; text-decoration:underline;">support@wotri.app</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
