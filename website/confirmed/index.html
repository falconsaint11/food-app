<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Confirmed · Wotri</title>
<meta name="description" content="Your Wotri email is confirmed.">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div class="wrap">
<a class="brand" href="/"><img src="/icon.png" alt="">Wotri</a>
<nav><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/support">Support</a></nav>
</div></header>
<main><div class="wrap">
<section class="hero">
<img src="/icon.png" alt="Wotri app icon">
<h1 id="title">You&rsquo;re confirmed</h1>
<p class="tagline" id="message">Your email is confirmed. Go back to the Wotri app and sign in.</p>
<a class="button" id="open" href="wotri://">Open Wotri</a>
<p class="note" id="note">If the button doesn&rsquo;t work, open Wotri from your home screen.</p>
</section>
<script>
// Supabase sends people here after they tap the link in their email. An
// expired or already-used link arrives with an error in the address.
(function () {
  var params = new URLSearchParams(
    (window.location.hash || '').replace(/^#/, '') + '&' + window.location.search.replace(/^\?/, '')
  );
  if (params.get('error') || params.get('error_code')) {
    document.getElementById('title').textContent = 'That link didn\u2019t work';
    document.getElementById('message').textContent =
      'It may have expired or already been used. Try signing in to Wotri. If your email still isn\u2019t confirmed, sign up again to get a new link.';
  }
})();
</script>
</div></main>
<footer><div class="wrap">
<a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/support">Support</a>
<p>&copy; 2026 Wotri</p>
</div></footer>
</body>
</html>
